name: Ryan prepares a release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag (for example v0.1.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-24.04
    steps:
      - name: Only Ryan can trigger the release
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$ACTOR" = LesCubistes
          test "$OWNER" = LesCubistes
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
  compatibility:
    needs: authorize
    uses: ./.github/workflows/compatibility.yml
  draft:
    needs: compatibility
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release environment
        run: docker build -t moon-ci -f tools/ci/Dockerfile .
      - name: Package tokenized game-only disks
        run: docker run --init --rm -v "$PWD:/workspace" moon-ci python3 tools/ci/package-release.py
      - name: Create draft for Ryan to review and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          cat > notes.md <<EOF
          Ryan Barrineau's Moon Mission ${VERSION}

          Land the lunar module on the Moon: a GW-BASIC game for the IBM PC/XT and compatibles with CGA graphics (or a Tandy 1000), first written for a VTech Laser XT.

          Download **Moon-Mission-game.zip** and read README.TXT inside:
          - FLOPPY/START.IMG and FLOPPY/LANDING.IMG: 360K disk images for real floppies or a Gotek
          - MOON/: every game file in one folder, for a hard disk or DOSBox

          You need your own DOS and GW-BASIC; neither is included. MAKEBOOT.BAT on the START disk can make it boot straight into the game.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$VERSION" release/Moon-Mission-game.zip release/SHA256SUMS \
            --target "$COMMIT" --draft --title "Moon Mission $VERSION" --notes-file notes.md
