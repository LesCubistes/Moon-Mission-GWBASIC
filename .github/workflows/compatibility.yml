name: Emulator compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  emulator:
    name: ${{ matrix.profile }} / ${{ matrix.cycles }} cycles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: Laser-XT-CGA-proxy
            machine: cga
            cycles: 300
          - profile: Tandy-1000-proxy
            machine: tandy
            cycles: 300
          - profile: IBM-PCjr-proxy
            machine: pcjr
            cycles: 300
          - profile: CGA-faster-CPU
            machine: cga
            cycles: 1200
    steps:
      - uses: actions/checkout@v4
      - name: Build test environment
        run: docker build -t moon-ci -f tools/ci/Dockerfile .
      - name: Build disks and run keyboard/screen journey
        env:
          MACHINE: ${{ matrix.machine }}
          CYCLES: ${{ matrix.cycles }}
        run: >-
          docker run --init --rm -v "$PWD:/workspace" moon-ci bash -euc
          'python3 tools/ci/prepare-runtime.py;
          bash tools/mkdisk.sh;
          python3 tools/ci/check-assembly.py;
          xvfb-run -a -s "-screen 0 1024x768x24" python3 tools/ci/emulator-test.py
          --machine '"$MACHINE"' --cycles '"$CYCLES"
      - name: Save screenshots, OCR, logs and result manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.profile }}-${{ matrix.cycles }}
          path: |
            build/ci/${{ matrix.machine }}-${{ matrix.cycles }}/
          if-no-files-found: warn
          retention-days: 14
